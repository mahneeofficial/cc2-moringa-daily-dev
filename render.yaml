# =============================================================================
# Render Blueprint — deploys the Moringa Daily Dev backend + PostgreSQL
# =============================================================================
# How to deploy (one-time):
#   1. Push this file to your repository (main branch or the fix branch).
#   2. Render dashboard → New → Blueprint → select the repo → Apply.
#      (or via CLI:  render blueprint launch  — https://render.com/docs/cli)
#   3. Render creates the database + web service and deploys automatically.
#
# What you get:
#   • moringa-db      — PostgreSQL (free plan: expires after 30 days inactive)
#   • moringa-backend — Flask API served by gunicorn
#       - DATABASE_URL is wired to the database automatically
#       - SECRET_KEY / JWT_SECRET_KEY are generated automatically
#       - tables are created + seeded (categories + admin/Admin123!) on boot
#         via setup_db.py — safe & idempotent on every deploy
#
# After the first deploy: change the seeded admin password (or delete that
# user) in the Render dashboard shell, and set GEMINI_API_KEY there if you
# want the AI features.
#
# NOTE (free plan): uploaded media lives on the service's ephemeral disk —
# files are lost on every redeploy. Uncomment the `disk:` block (paid plans)
# to persist them.
# =============================================================================

databases:
  - name: moringa-db
    databaseName: moringa
    user: moringa
    plan: free

services:
  - type: web
    name: moringa-backend
    runtime: python
    plan: free
    rootDir: backend
    region: frankfurt                   # closest to Kenya/Nairobi
    buildCommand: pip install -r requirements.txt
    startCommand: python setup_db.py && gunicorn -w 2 --threads 4 -b 0.0.0.0:$PORT run:app
    healthCheckPath: /
    autoDeploy: true                    # redeploy on every push to main

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: moringa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true             # generated once, stored by Render
      - key: JWT_SECRET_KEY
        generateValue: true             # generated once, stored by Render
      # Optional — add your Gemini key in the Render dashboard for AI features:
      # - key: GEMINI_API_KEY
      #   sync: false

    # Uncomment on a paid plan to keep uploaded media across deploys:
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/app/static/uploads
    #   sizeGB: 1

# =============================================================================
