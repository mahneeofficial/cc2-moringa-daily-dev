# 1. Deploy the backend first and copy its URL (e.g. https://moringa-backend.onrender.com)
# 2. Uncomment the block below, put that URL in VITE_API_BASE_URL,
#    push, and Render will build & host the frontend.
# (Alternatively deploy the client on Vercel/Netlify with the same env var.)
